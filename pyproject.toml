[project]
name = "gript"
version = "0.1.0"
description = "A Fantastic DevOps Tool"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.0.15",
    "gitpython>=3.1.45",
    "pydantic-ai>=0.4.9",
    "pydantic-ai-slim[duckduckgo]>=0.4.9",
    "python-dotenv>=1.1.1",
    "semver>=3.0.4",
    "sentence-transformers>=5.0.0",
    "tiktoken>=0.9.0",
    "toml>=0.10.2",
    "typer>=0.16.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
gript = "gript.main:app"


